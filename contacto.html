<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LETRAS---ECO | Contacto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body data-page="contacto">

    <main>
        <div class="container">
            <header class="catalog-header">
                <h2 class="section-title serif-title">Ponte en Contacto</h2>
                <p class="catalog-subtitle">¿Tienes alguna pregunta o deseas hacer un pedido especial? Escríbenos.</p>
            </header>

            <div class="contact-grid">
                
                <!-- Formulario de Contacto -->
                <section class="contact-card">
                    <h3 class="serif-title">Envíanos un mensaje</h3>
                    <form id="contact-form" class="contact-form" novalidate>
                        <div class="form-group">
                            <label for="nombre">Nombre Completo</label>
                            <input type="text" id="nombre" name="nombre" placeholder="Ej. Ana María Silva" required>
                            <span class="error-text" id="error-nombre"></span>
                        </div>
                        <div class="form-group">
                            <label for="email">Correo Electrónico</label>
                            <input type="email" id="email" name="email" placeholder="tu@correo.com" required>
                            <span class="error-text" id="error-email"></span>
                        </div>
                        <div class="form-group">
                            <label for="asunto">Asunto</label>
                            <input type="text" id="asunto" name="asunto" placeholder="Consulta sobre un libro" required>
                            <span class="error-text" id="error-asunto"></span>
                        </div>
                        <div class="form-group">
                            <label for="mensaje">Mensaje</label>
                            <textarea id="mensaje" name="mensaje" rows="4" placeholder="Escribe tu consulta aquí..." required></textarea>
                            <span class="error-text" id="error-mensaje"></span>
                        </div>
                        <button type="submit" id="btn-submit-contact" class="btn btn-amber btn-block">Enviar Mensaje</button>
                    </form>
                </section>

                <!-- Información y Mapa -->
                <section class="contact-card contact-info">
                    <h3 class="serif-title">Información de Atención</h3>
                    
                    <div class="info-details">
                        <div class="info-item">
                            <strong>Correo Electrónico:</strong>
                            <p>contacto@letraseco.com</p>
                        </div>
                        <div class="info-item">
                            <strong>Teléfono:</strong>
                            <p>+57 (601) 555-0192</p>
                        </div>
                        <div class="info-item">
                            <strong>Dirección Física:</strong>
                            <p>Calle 72 # 10-34, Chapinero<br>Bogotá, Colombia</p>
                        </div>
                    </div>

                    <!-- Visual de Google Maps Integrado -->
                    <div class="map-container">
                        <iframe 
                            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3976.588825827725!2d-74.058318!3d4.658252!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8e3f9a5d1b32d209%3A0x6a123456789abcdef!2sCl.%2072%20%2310-34%2C%20Bogot%C3%A1!5e0!3m2!1ses!2sco!4v1710000000000!5m2!1ses!2sco" 
                            width="100%" 
                            height="220" 
                            style="border:0;" 
                            allowfullscreen="" 
                            loading="lazy" 
                            referrerpolicy="no-referrer-when-downgrade">
                        </iframe>
                    </div>
                </section>

            </div>
        </div>
    </main>

    <!-- Notificación Toast Dinámica -->
    <div id="toast-notification" class="toast hidden"></div>

    <script src="script.js"></script>
</body>
</html>
